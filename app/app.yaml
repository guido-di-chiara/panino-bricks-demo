# Databricks App runtime config for the Panino Bricks lab.
command: ["streamlit", "run", "app.py", "--server.port", "8000", "--server.enableCORS", "false"]

env:
  - name: MAS_ENDPOINT_NAME
    value: "YOUR-MAS-ENDPOINT-NAME"
  - name: LAKEBASE_INSTANCE_NAME
    value: "panino-bricks"
  - name: LAKEBASE_DATABASE_NAME
    value: "databricks_postgres"
  - name: PB_CATALOG
    value: "demo_30_giugno"
  - name: PB_SCHEMA
    value: "YOUR_NICKNAME"